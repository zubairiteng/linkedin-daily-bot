name: Daily LinkedIn News Post

on:
  schedule:
    # Triggers daily at 03:00 UTC (8:00 AM Pakistan Standard Time / PKT, UTC+5)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      skip_delay:
        description: 'Skip randomized delay and run immediately'
        type: boolean
        default: true
      dry_run:
        description: 'Run in dry-run mode (preview without posting)'
        type: boolean
        default: false

jobs:
  post-daily:
    name: Research & Post to LinkedIn
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub Actions maximum job timeout (6 hours)
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore persistent database cache
        uses: actions/cache@v4
        with:
          path: posted.db
          key: posted-db-${{ github.run_id }}
          restore-keys: |
            posted-db-

      - name: Restore .env and token.json from secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_TOKEN_JSON: ${{ secrets.LINKEDIN_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/restore_secrets.py

      - name: Randomized Human-Mimic Delay
        if: github.event_name != 'workflow_dispatch' || inputs.skip_delay != true
        env:
          # Up to 18,000s (5 hours) by default to stay safely within GitHub Actions 6-hour job ceiling
          # Triggers between 8:00 AM and 1:00 PM PKT. Can be customized via repository variable.
          RANDOM_DELAY_MAX_SECONDS: ${{ vars.RANDOM_DELAY_MAX_SECONDS || '18000' }}
        run: |
          python -c "
          import os, random, time
          max_sec = int(os.getenv('RANDOM_DELAY_MAX_SECONDS', '18000'))
          sleep_sec = random.randint(0, max_sec)
          hours = sleep_sec // 3600
          mins = (sleep_sec % 3600) // 60
          secs = sleep_sec % 60
          print(f'[Human-Mimic Delay] Sleeping for {hours}h {mins}m {secs}s ({sleep_sec} seconds) before posting...')
          time.sleep(sleep_sec)
          print('[Human-Mimic Delay] Delay complete! Starting bot run now.')
          "

      - name: Run LinkedIn Daily Bot
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Running in DRY RUN mode (no actual post)..."
            python main.py --dry-run
          else
            echo "Running in LIVE mode..."
            python main.py
          fi

      - name: Upload run artifacts (database & logs)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linkedin-bot-run-data
          path: |
            bot.log
            posted.db
          retention-days: 30
